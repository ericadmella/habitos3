name: habitos_app
description: "HábitosApp - Registro de hábitos con persistencia local en SQLite (ACT02 DAM2 - Accés a dades)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Dependencias añadidas con:
#   flutter pub add shared_preferences
#   flutter pub add intl
#   flutter pub add sqflite sqflite_common_ffi path
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Ajustes y preferencias de la aplicación.
  shared_preferences: ^2.3.2
  # intl: internacionalización y formateo de fechas/números según el idioma.
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
